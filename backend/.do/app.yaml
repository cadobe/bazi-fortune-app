{
  "name": "bazi-fortune-app",
  "services": [
    {
      "name": "api",
      "source_dir": "/",
      "github": {
        "repo": "your-username/bazi-fortune-app",
        "branch": "main"
      },
      "run_command": "npm start",
      "environment_slug": "node-js",
      "instance_count": 1,
      "instance_size_slug": "basic-xxs",
      "health_check": {
        "http_path": "/health"
      },
      "env": [
        {
          "key": "NODE_ENV",
          "value": "production"
        },
        {
          "key": "JWT_SECRET",
          "value": "${bazi-jwt-secret.JWT_SECRET}",
          "type": "SECRET"
        },
        {
          "key": "MONGODB_URI",
          "value": "${bazi-db.DATABASE_URL}",
          "type": "SECRET"
        },
        {
          "key": "REDIS_URL",
          "value": "${bazi-redis.REDIS_URL}",
          "type": "SECRET"
        }
      ]
    }
  ],
  "databases": [
    {
      "name": "bazi-db",
      "engine": "MONGODB",
      "size": "basic-xs"
    },
    {
      "name": "bazi-redis",
      "engine": "REDIS",
      "size": "basic-xs"
    }
  ]
}